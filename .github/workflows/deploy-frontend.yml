name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user

            if [ ! -d "selected-group" ]; then
              git clone https://github.com/harryselectedjobs/selected-group.git
            fi

            cd selected-group

            # Pull latest code from main
            git fetch --all
            git reset --hard origin/main

            # Stop and remove old container
            docker stop frontend || true
            docker rm frontend || true

            # Remove old image to force fresh build
            docker rmi selected-group-frontend || true

            # Free up disk space: remove unused images, containers, volumes, cache
            docker system prune -af --volumes

            # Build new image (no cache)
            docker build --no-cache -t selected-group-frontend .

            # Run new container
            docker run -d -p 3000:80 --name frontend selected-group-frontend