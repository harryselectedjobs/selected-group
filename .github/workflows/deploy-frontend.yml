name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VITE_GNEWS_API_KEY: ${{ secrets.VITE_GNEWS_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 30m
          envs: VITE_GNEWS_API_KEY

          script: |
            cd ~

            if [ ! -d "selected-group" ]; then
              git clone https://github.com/harryselectedjobs/selected-group.git
            fi

            cd selected-group

            git fetch origin
            git reset --hard origin/main

            docker stop frontend || true
            docker rm frontend || true

            docker build \
              --build-arg VITE_GNEWS_API_KEY=$VITE_GNEWS_API_KEY \
              -t selected-group-frontend .

            docker run -d \
              --restart unless-stopped \
              -p 3000:80 \
              --name frontend \
              selected-group-frontend

            docker image prune -f